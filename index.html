const BASE_CURRENCY = 'CNY';

const SUPPORTED = ['USD', 'EUR', 'JPY', 'HKD', 'GBP', 'KRW', 'TWD', 'SGD', 'AUD', 'CAD', 'THB', 'MYR'];

const CURRENCY_ALIAS = {
  人民币: 'CNY', 元: 'CNY', RMB: 'CNY', CNY: 'CNY',
  美元: 'USD', 美金: 'USD', USD: 'USD', 刀: 'USD',
  欧元: 'EUR', EUR: 'EUR',
  日元: 'JPY', 日币: 'JPY', JPY: 'JPY',
  港币: 'HKD', 港元: 'HKD', HKD: 'HKD',
  英镑: 'GBP', GBP: 'GBP',
  韩元: 'KRW', 韩币: 'KRW', KRW: 'KRW',
  新台币: 'TWD', 台币: 'TWD', TWD: 'TWD',
  新加坡元: 'SGD', 新币: 'SGD', SGD: 'SGD',
  澳元: 'AUD', 澳币: 'AUD', AUD: 'AUD',
  加元: 'CAD', 加币: 'CAD', CAD: 'CAD',
  泰铢: 'THB', THB: 'THB',
  马币: 'MYR', 林吉特: 'MYR', MYR: 'MYR'
};

/** 把各种写法的币种统一成 ISO 代码；认不出的按人民币处理。 */
function normalizeCurrency(value) {
  const raw = String(value == null ? '' : value).trim();
  if (!raw) return BASE_CURRENCY;
  const upper = raw.toUpperCase();
  if (upper === BASE_CURRENCY) return BASE_CURRENCY;
  if (SUPPORTED.includes(upper)) return upper;
  return CURRENCY_ALIAS[raw] || CURRENCY_ALIAS[upper] || BASE_CURRENCY;
}

function isForeign(code) {
  return !!code && code !== BASE_CURRENCY;
}

function normalizeCategory(value, text = '') {
  const raw = String(value || '').trim();
  const body = String(text || '');
  if (categories.includes(raw) && raw !== '其他') return raw;
  const probe = raw === '其他' ? body : (raw || body);
  for (const [name, re] of CATEGORY_HINTS) if (re.test(probe)) return name;
  const inferred = inferCategory(probe);
  if (categories.includes(inferred) && inferred !== '其他') return inferred;
  return raw === '其他' ? '其他' : '';
}

function normalizeType(value) {
  const s = String(value || '').trim();
  if (/收入|入账|退款|工资|奖金|利息|报销|income|credit|receive/i.test(s)) return 'income';
  return 'expense';
}

function normalizeDate(value, at = today()) {
  const s = String(value || '').trim();
  if (!s) return at;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s) && !Number.isNaN(Date.parse(s))) return s;
  const rel = {'今天': 0, '今日': 0, '昨天': -1, '昨日': -1, '前天': -2};
  if (s in rel) return shiftDate(at, rel[s]);
  const ymd = /(\d{4})\s*[年./-]\s*(\d{1,2})\s*[月./-]\s*(\d{1,2})/.exec(s);
  if (ymd) return padDate(ymd[1], ymd[2], ymd[3], at);
  const md = /(\d{1,2})\s*[月./-]\s*(\d{1,2})/.exec(s);
  if (md) return padDate(at.slice(0, 4), md[1], md[2], at);
  return at;
}

function padDate(year, month, day, fallback) {
  const m = Number(month), d = Number(day);
  if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31)) return fallback;
  const out = year + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  return Number.isNaN(Date.parse(out)) ? fallback : out;
}

function amountCents(value) {
  if (typeof value === 'number') {
    if (!Number.isFinite(value)) return null;
    try { return toCents(Math.abs(value).toFixed(2)); } catch { return null; }
  }
  if (typeof value !== 'string') return null;
  const cleaned = value.replace(/[\s,，]/g, '').replace(/[¥￥$]/g, '').replace(/元|人民币|RMB|CNY/gi, '');
  const hit = /-?\d+(?:\.\d{1,3})?/.exec(cleaned);
  if (!hit) return null;
  const n = Math.abs(Number(hit[0]));
  if (!Number.isFinite(n)) return null;
  try { return toCents(n.toFixed(2)); } catch { return null; }
}

function clean(value, max) {
  return String(value == null ? '' : value).replace(/\s+/g, ' ').trim().slice(0, max);
}

function balancedSlice(text, start) {
  const open = text[start];
  const close = open === '{' ? '}' : ']';
  let depth = 0, inString = false, escaped = false;
  for (let i = start; i < text.length; i++) {
    const ch = text[i];
    if (inString) {
      if (escaped) escaped = false;
      else if (ch === '\\') escaped = true;
      else if (ch === '"') inString = false;
      continue;
    }
    if (ch === '"') inString = true;
    else if (ch === open) depth++;
    else if (ch === close) {
      depth--;
      if (depth === 0) return text.slice(start, i + 1);
    }
  }
  return '';
}

function stripFence(text) {
  const fence = String.fromCharCode(96, 96, 96);
  const first = text.indexOf(fence);
  if (first < 0) return text;
  let rest = text.slice(first + 3);
  rest = rest.replace(/^json/i, '');
  const end = rest.indexOf(fence);
  return (end < 0 ? rest : rest.slice(0, end)).trim();
}

function parseModelJson(text) {
  const raw = String(text == null ? '' : text).trim();
  if (!raw) throw new Error('模型没有返回内容，请重试');
  const body = stripFence(raw);
  const start = body.search(/[{[]/);
  if (start < 0) throw new Error('模型返回的内容里没有 JSON，请重试或改用文字输入');
  const candidate = balancedSlice(body, start);
  if (!candidate) throw new Error('模型返回的 JSON 不完整，请重试');
  try {
    return JSON.parse(candidate);
  } catch {
    throw new Error('模型返回的 JSON 无法解析，请重试或改用手动填写');
  }
}

function recordList(payload) {
  if (Array.isArray(payload)) return payload;
  if (!payload || typeof payload !== 'object') return [];
  if (Array.isArray(payload.records)) return payload.records;
  if (Array.isArray(payload.data)) return payload.data;
  if (Array.isArray(payload.transactions)) return payload.transactions;
  if (payload.record && typeof payload.record === 'object') return [payload.record];
  if ('amount' in payload || 'title' in payload) return [payload];
  return [];
}

function normalizeReceipt(payload, at = today(), label = '图片') {
  if (payload && typeof payload === 'object' && !Array.isArray(payload)) {
    if (payload.error) throw new Error(String(payload.error.message || payload.error));
    if (Array.isArray(payload.records) && !payload.records.length) {
      throw new Error(payload.reason ? '没有可入账的金额：' + payload.reason : '没有从' + label + '里读出可入账的金额，请改用手动填写');
    }
  }
  const drafts = [];
  for (const item of recordList(payload).slice(0, 20)) {
    const draft = draftFromItem(item, at);
    if (draft) drafts.push(draft);
  }
  if (!drafts.length) throw new Error('没有从' + label + '里读出可入账的金额，请改用手动填写');
  return drafts;
}

function draftFromItem(item, at = today()) {
  if (!item || typeof item !== 'object') return null;
  const cents = amountCents(item.amount);
  if (cents === null) return null;
  const merchant = clean(item.merchant || item.shop || item.payee, 40);
  const rawTitle = clean(item.title || item.name || item.description, 40) || merchant;
  const title = rawTitle || '未命名的一笔';
  const note = clean(item.note || merchant, 60);
  const currency = normalizeCurrency(item.currency);
  const draft = {
    id: createId(),
    title,
    amount: cents,
    date: normalizeDate(item.date || item.time || item.paidAt, at),
    category: normalizeCategory(item.category, title + ' ' + note),
    type: normalizeType(item.type || item.direction),
    note
  };
  if (isForeign(currency)) {
    draft.currency = currency;
    const original = amountCents(item.originalAmount);
    if (original !== null) draft.originalAmount = original;
  }
  return draft;
}

function receiptFileCheck(file) {

  if (file.size > 10 * 1024 * 1024) return '图片需在 10 MB 以内';
  return '';
}

function readSummary(payload) {

  return String(payload.summary || payload.reason || '').replace(/\s+/g, ' ').trim().slice(0, 120);

function toDrafts(payload, at = today()) {

function auditDrafts(drafts, text, at = today()) {
  const warnings = [];
  const raw = String(text == null ? '' : text);
  const numbers = [...raw.matchAll(/\d+(?:\.\d{1,2})?/g)].map(m => Number(m[0])).filter(Number.isFinite);
  const split = SPLIT_INTENT.test(raw);
  const host = HOST_INTENT.test(raw);
  if (split && drafts.length === 1 && numbers.some(n => Math.abs(n - drafts[0].amount / 100) < 0.005)) {
    warnings.push('这句话提到 AA/均摊，但金额正好等于原文的总价，确认一下是不是没拆开。');
  }
  if (host && !split && drafts.length > 1) {
    warnings.push('这句话是请客 / 你自己全额付款，应该是一条全额记录，确认是否被拆成了多笔。');
  }
  if (drafts.some(d => d.date > at)) warnings.push('有记录的日期在今天之后，请核对。');
  if (drafts.some(d => d.type === 'income') && split) warnings.push('AA 场景被标成了收入，请核对。');
  if (drafts.some(d => !d.category)) warnings.push('有记录没判断出分类，可以先留空，之后在账本里补。');
  return [...new Set(warnings)];
}

const SPLIT_INTENT = /AA|aa|A\s*A|均摊|平摊|平分|各付|各出|每人付|一人一半|对半分/;
const HOST_INTENT = /请客|我请|我买单|买我的单|我付钱|我付|我结账|我结|做东|招待|算我的|我出钱|请大家|请(?:了)?[0-9一二三四五六七八九十两]*(?:个|位|名)?(?:朋友|同事|同学|家人|客)/;
const PARTITION_INTENT = /其中|分别|另外|还有|加上|减去|一件|一杯|一份|每个/;

const CN_DIGIT = {零: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9};
const CN_UNIT = {十: 10, 百: 100, 千: 1000, 万: 10000};

function chineseToNumber(input) {
  const s = String(input == null ? '' : input).replace(/[元块钱]/g, '');
  if (!s) return null;
  if (/^\d+(?:\.\d{1,2})?$/.test(s)) return Number(s);
  const block = /^([一二三四五六七八九两])(?:块|元)([一二三四五六七八九])$/.exec(String(input));
  if (block) return Number(CN_DIGIT[block[1]] + '.' + CN_DIGIT[block[2]]);

  let total = 0, section = 0, cur = 0, lastUnit = 0, seen = false;
  for (const ch of s) {
    if (CN_DIGIT[ch] !== undefined) {
      cur = CN_DIGIT[ch];
      seen = true;
      continue;
    }
    const unit = CN_UNIT[ch];
    if (!unit) return null;
    seen = true;
    if (unit === 10000) {
      section += cur;
      total += (section || 1) * 10000;
      section = 0;
    } else {
      section += (cur || 1) * unit;
    }
    lastUnit = unit;
    cur = 0;
  }
  if (cur) {
    section += lastUnit >= 100 ? cur * (lastUnit / 10) : cur;
  }
  const result = total + section;
  return seen ? result : null;
}

function hasSplitIntent(text) {
  return SPLIT_INTENT.test(String(text == null ? '' : text));
}

function hasHostIntent(text) {
  return HOST_INTENT.test(String(text == null ? '' : text));
}

/**
 * 从一句话里找“总额”。marked=true 表示被“花了/一共/共…”明确标注，可信度更高。
 * 支持阿拉伯数字与常见中文数字（三百、三千二、两千五、两块五）。
 */
function readTotal(text) {
  const s = String(text == null ? '' : text);
  const NUM = '(\\d{1,3}(?:,\\d{3})+(?:\\.\\d{1,2})?|\\d+(?:\\.\\d{1,2})?|[零一二三四五六七八九十百千万两]+)';
  const marked = new RegExp('(?:花了|一共|总共|共|合计|总价|付款|支付|消费|花费)\\s*(?:了)?\\s*' + NUM).exec(s);
  if (marked) {
    const raw = marked[1];
    const value = /^\d/.test(raw) ? Number(raw.replaceAll(',', '')) : chineseToNumber(raw);
    if (Number.isFinite(value) && value > 0) return {cents: Math.round(value * 100), marked: true};
  }
  const nums = [...s.matchAll(/\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?/g)]
    .map(m => Number(m[0].replaceAll(',', '')))
    .filter(n => Number.isFinite(n) && n > 0);
  if (!nums.length) return {cents: 0, marked: false};
  return {cents: Math.round(Math.max(...nums) * 100), marked: false};
}

/**
 * 确定性兜底：不等模型"想明白"，命中下列情况就把金额还原为总额。
 *   1) 付款意图（请客 / 我买单…）且无任何分摊词 → 一定是全额
 *   2) 无分摊词，但句子里有明确总额标记（花了400 / 一共三百）→ 模型无权自行拆分
 * 只在"疑似被拆过"时动手：总额恰为单笔的 2~12 倍，且总额更大。
 */
function applyPaymentIntent(drafts, text) {
  const none = {drafts, fix: null};
  if (!Array.isArray(drafts) || drafts.length !== 1) return none;
  const raw = String(text == null ? '' : text);
  if (SPLIT_INTENT.test(raw)) return none;
  if (PARTITION_INTENT.test(raw)) return none;
  const d = drafts[0];
  if (!d || !d.amount) return none;

  const total = readTotal(raw);
  if (!total.cents) return none;
  const host = HOST_INTENT.test(raw);
  if (!host && !total.marked) return none;
  if (total.cents <= d.amount) return none;

  const ratio = total.cents / d.amount;
  const n = Math.round(ratio);
  if (Math.abs(ratio - n) > 0.02 || n < 2 || n > 12) return none;

  const tag = host ? '请客按全额' : '未提分摊，按总额';
  const note = ((d.note ? d.note + ' · ' : '') + tag).slice(0, 60);
  return {
    drafts: [{...d, amount: total.cents, note}],
    fix: {from: d.amount, to: total.cents, ratio: n, kind: host ? 'host' : 'total'}
  };
}


function formatYuan(cents, digits = 0) {
  return (cents / 100).toLocaleString('zh-CN', {minimumFractionDigits: digits, maximumFractionDigits: digits});
}

function monthDelta(state, month) {
  const [y, mm] = String(month).split('-').map(Number);
  const prevMonth = new Date(Date.UTC(y, mm - 2, 1)).toISOString().slice(0, 7);
  const expenseOf = m => state.transactions
    .filter(t => t.date.startsWith(m) && t.type === 'expense')
    .reduce((s, t) => s + t.amount, 0);
  return {prevMonth, prevExp: expenseOf(prevMonth), curExp: expenseOf(month)};
}

function generateInsights(state, month) {
  const rows = state.transactions.filter(t => t.date.startsWith(month));
  const totalsRow = totals(rows);
  if (!totalsRow.expense) return [];
  const list = summarize(rows).filter(x => x.name !== '未分类');
  const delta = monthDelta(state, month);
  const out = [];

  if (delta.prevExp > 0) {
    const pct = Math.round((totalsRow.expense - delta.prevExp) / delta.prevExp * 100);
    if (Math.abs(pct) >= 8) {
      out.push({
        code: 'trend',
        icon: 'trend',
        text: '本月支出 ¥' + formatYuan(totalsRow.expense) + '，较 ' + delta.prevMonth.replace('-', '年') + ' 月' + (pct > 0 ? '上升' : '下降') + ' ' + Math.abs(pct) + '%。',
        pct
      });
    }
  }

  const top = list[0];
  if (top) {
    const pct = Math.round(top.amount / totalsRow.expense * 100);
    if (pct >= 25) {
      out.push({
        code: 'top',
        icon: 'pie',
        text: top.name + '占比最高（' + pct + '%），共 ¥' + formatYuan(top.amount) + '，可以留意这类支出是否超出预期。',
        category: top.name,
        pct
      });
    } else {
      out.push({
        code: 'spread',
        icon: 'pie',
        text: '本月支出比较分散，最大一类是 ' + top.name + '（' + pct + '%），没有特别集中的开销。',
        category: top.name,
        pct
      });
    }
  }

  const budget = Number(state.budget) || 0;
  if (budget > 0) {
    if (totalsRow.expense > budget) {
      out.push({code: 'over', icon: 'wallet', text: '本月已支出 ¥' + formatYuan(totalsRow.expense) + '，超出预算 ¥' + formatYuan(totalsRow.expense - budget) + '，可以放慢节奏。', level: 'warn'});
    } else if (totalsRow.expense > budget * 0.8) {
      out.push({code: 'near', icon: 'wallet', text: '预算已使用 ' + Math.round(totalsRow.expense / budget * 100) + '%，接近 ¥' + formatYuan(budget) + ' 上限，留意剩余额度。', level: 'warn'});
    }
  }

  if (!out.length) out.push({code: 'calm', icon: 'leaf', text: '本月收支平稳，继续保持记录的好习惯。'});
  return out;
}



function resaleCandidates(state, at = today()) {
  return state.assets
    .filter(a => a.status === '闲置' && Number(a.price) > 0)
    .map(a => {
      const days = Math.max(0, daysBetween(a.date, at));
      const val = valuation(a, at);
      const drop = Math.max(0, Math.round((1 - val / a.price) * 100));
      return {a, days, val, drop};
    })
    .sort((x, y) => y.days - x.days || y.drop - x.drop);
}

function resaleAdvice(candidates) {
  if (!candidates.length) return [];
  const lines = [];
  const top = candidates[0];
  if (top.days > 90) {
    lines.push('「' + top.a.name + '」已闲置 ' + top.days + ' 天，估值较购入价下降约 ' + top.drop + '%，越早转手越能保留价值。');
  }
  if (candidates.length >= 2) {
    const total = candidates.reduce((s, x) => s + x.val, 0);
    lines.push('你有 ' + candidates.length + ' 件闲置物品，合计估值约 ¥' + formatYuan(total) + '，可以考虑集中处理。');
  }
  for (const x of candidates.filter(x => x.drop > 50).slice(0, 2)) {
    lines.push('「' + x.a.name + '」折旧已超过一半，建议优先转卖或回收。');
  }
  if (!lines.length) {
    lines.push('有 ' + candidates.length + ' 件闲置物品，暂时没有明显的折价压力，可以先整理成色再决定。');
  }
  return lines;
}



const DATE = /^\d{4}-\d{2}-\d{2}$/;

function cleanTx(t) {
  const amount = Number(t.amount);
  const date = String(t.date || '');
  if (!t || typeof t !== 'object') return null;
  if (!String(t.title || '').trim()) return null;
  if (!Number.isSafeInteger(amount) || amount <= 0) return null;
  if (!DATE.test(date)) return null;
  return {
    id: String(t.id || ''),
    title: String(t.title).trim().slice(0, 60),
    amount,
    category: categories.includes(t.category) ? t.category : '其他',
    date,
    type: t.type === 'income' ? 'income' : 'expense',
    note: String(t.note || '').slice(0, 160)
  };
}

function cleanAsset(a) {
  if (!a || typeof a !== 'object') return null;
  if (!String(a.name || '').trim()) return null;
  const price = Number(a.price);
  if (!Number.isSafeInteger(price) || price <= 0) return null;
  const date = String(a.date || '');
  if (!DATE.test(date)) return null;
  const life = Number(a.life);
  return {
    id: String(a.id || ''),
    name: String(a.name).trim().slice(0, 60),
    category: categories.includes(a.category) ? a.category : '其他',
    emoji: ['box', 'headphones', 'laptop', 'camera', 'bag', 'book'].includes(a.emoji) ? a.emoji : 'box',
    price,
    date,
    life: Number.isFinite(life) && life >= 0.5 && life <= 100 ? life : 3,
    residual: Math.min(price, Math.max(0, Number(a.residual) || 0)),
    returnDate: DATE.test(String(a.returnDate || '')) ? a.returnDate : '',
    warrantyDate: DATE.test(String(a.warrantyDate || '')) ? a.warrantyDate : '',
    status: ['使用中', '待退货', '闲置', '已售出', '已回收'].includes(a.status) ? a.status : '使用中',
    txId: String(a.txId || ''),
    note: String(a.note || '').slice(0, 160),
    resale: a.resale === null || a.resale === undefined ? null : Math.max(0, Number(a.resale) || 0)
  };
}

function parseBackup(text, fallbackBudget = 0) {
  let data;
  try {
    data = JSON.parse(String(text));
  } catch {
    throw new Error('文件不是有效的 JSON');
  }
  if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('文件格式不正确');
  if (!Array.isArray(data.transactions) && !Array.isArray(data.assets)) {
    throw new Error('备份里没有 transactions 或 assets');
  }
  const txSrc = Array.isArray(data.transactions) ? data.transactions : [];
  const assetSrc = Array.isArray(data.assets) ? data.assets : [];
  const transactions = txSrc.slice(0, 20000).map(cleanTx).filter(Boolean);
  const assets = assetSrc.slice(0, 5000).map(cleanAsset).filter(Boolean);
  const dropped = txSrc.length - transactions.length + (assetSrc.length - assets.length);
  const budget = Number(data.budget);
  return {
    state: {
      version: 1,
      budget: Number.isSafeInteger(budget) && budget > 0 ? budget : fallbackBudget,
      transactions,
      assets,
      watchlist: Array.isArray(data.watchlist) ? data.watchlist.filter(x => typeof x === 'string').slice(0, 20) : [],
      seedMonth: String(data.seedMonth || '').slice(0, 7) || today().slice(0, 7)
    },
    kept: transactions.length + assets.length,
    dropped
  };
}

function mergeStates(current, incoming) {
  const seenTx = new Set(current.transactions.map(t => t.id).filter(Boolean));
  const seenKey = new Set(current.transactions.map(t => [t.title, t.amount, t.date, t.type].join('|')));
  const added = [];
  let duplicates = 0;
  for (const t of incoming.transactions) {
    const key = [t.title, t.amount, t.date, t.type].join('|');
    if ((t.id && seenTx.has(t.id)) || seenKey.has(key)) { duplicates++; continue; }
    if (t.id) seenTx.add(t.id);
    seenKey.add(key);
    added.push(t);
  }
  const seenAsset = new Set(current.assets.map(a => a.id).filter(Boolean));
  const addedAssets = incoming.assets.filter(a => {
    if (a.id && seenAsset.has(a.id)) return false;
    if (a.id) seenAsset.add(a.id);
    return true;
  });
  return {
    state: {
      ...current,
      transactions: [...added, ...current.transactions],
      assets: [...current.assets, ...addedAssets],
      watchlist: current.watchlist
    },
    added: added.length,
    addedAssets: addedAssets.length,
    duplicates
  };
}


function notificationSupport(win) {
  return !!(win && 'Notification' in win);
}

function notificationLabel(win) {
  if (!notificationSupport(win)) return '浏览器不支持';
  const p = win.Notification.permission;
  return p === 'granted' ? '已开启' : p === 'denied' ? '已拒绝' : '未开启';
}

function notificationGranted(win) {
  return notificationSupport(win) && win.Notification.permission === 'granted';
}

function dueReminders(reminders, seen = [], maxDays = 7) {
  const known = new Set(seen);
  const out = [];
  for (const r of reminders) {
    if (r.days > maxDays) continue;
    const key = r.a.id + '-' + r.type + '-' + r.date;
    if (known.has(key)) continue;
    out.push({...r, key});
  }
  return out;
}

function notificationBody(r) {
  const when = r.days === 0 ? '今天到期' : r.days + '天后';
  return r.a.name + ' ' + r.type + '提醒：' + when + '（' + String(r.date).replaceAll('-', '.') + '）';
}

  科技: ['半导体', '芯片', '人工智能', '大模型', '互联网', '软件', '电子', '字节', '腾讯', '华为', '算力', '机器人', '数据中心', '云计算', '新能源车', 'AI']

function sectorOf(text) {

const QUOTE_SOURCE = '腾讯行情';

function formatQuoteTime(raw) {
  const s = String(raw || '').trim();
  const digits = s.replace(/\D/g, '');
  if (digits.length >= 12) {
    const hh = digits.slice(8, 10), mm = digits.slice(10, 12);
    if (/^\d{2}$/.test(hh) && /^\d{2}$/.test(mm)) return hh + ':' + mm;
  }
  const m = /(\d{2}):(\d{2})/.exec(s);
  return m ? m[1] + ':' + m[2] : '';
}

function parseQuote(raw) {
  const v = String(raw || '').split('~');
  if (v.length < 33) return null;
  const price = Number(v[3]);
  if (!Number.isFinite(price) || price <= 0) return null;
  const pct = Number(v[32]);
  const change = Number.isFinite(pct) ? pct : 0;
  return {
    name: String(v[1] || '').trim(),
    price: String(v[3]).trim(),
    prevClose: String(v[4] || '').trim(),
    change,
    up: change > 0,
    time: formatQuoteTime(v[30])
  };
}

/**
 * 行情 loader。mode 预留 'proxy'，接口一致，后端就绪时换实现即可。
 */
function createQuoteLoader({win, doc, source = 'direct', timeout = 6000} = {}) {
  let cache = {};
  let pending = false;
  let error = '';

  function load(codes, cb) {
    const uniq = [...new Set(codes.filter(Boolean))];
    if (!uniq.length) {
      error = '';
      if (cb) cb();
      return;
    }
    if (pending) {
      if (cb) cb();
      return;
    }
    if (source === 'proxy') {
      fetch('/api/market?codes=' + encodeURIComponent(uniq.join(',')))
        .then(r => r.json())
        .then(json => {
          const next = {};
          for (const code of uniq) {
            const q = parseQuote(json && json[code]);
            if (q) next[code] = q;
          }
          cache = next;
          error = Object.keys(next).length ? '' : '行情解析失败';
          if (cb) cb();
        })
        .catch(() => {
          error = '无法连接行情接口';
          if (cb) cb();
        });
      return;
    }

    pending = true;
    const next = {};
    let done = 0;
    const finish = () => {
      done++;
      if (done < uniq.length) return;
      cache = next;
      error = Object.keys(next).length ? '' : '行情解析失败';
      pending = false;
      if (cb) cb();
    };
    for (const code of uniq) {
      const s = doc.createElement('script');
      s.src = 'https://qt.gtimg.cn/q=' + encodeURIComponent(code);
      s.async = true;
      s.onload = () => {
        try {
          const q = parseQuote(win['v_' + code]);
          if (q) next[code] = q;
        } catch {}
        finish();
      };
      s.onerror = finish;
      const timer = setTimeout(() => finish(), timeout);
      doc.head.appendChild(s);
      if (timer && timer.unref) timer.unref();
    }
  }

  return {
    load,
    get: code => cache[code] || null,
    snapshot: () => ({cache, error, pending}),
    reset: () => { cache = {}; error = ''; pending = false; }
  };
}



function formatNewsTime(raw) {
  const s = String(raw || '').trim();
  const m = /(\d{1,2}):(\d{2})/.exec(s);
  if (m) return m[1].padStart(2, '0') + ':' + m[2];
  return '';
}

function parseNewsFeed(payload) {
  const list = payload && payload.result && payload.result.data
    && payload.result.data.feed && payload.result.data.feed.list;
  if (!Array.isArray(list)) return [];
  return list.map(n => {
    const text = String(n.rich_text || '');
    return {
      id: String(n.id || ''),
      title: text.replace(/^【[^】]*】/, '').trim().slice(0, 80),
      summary: text.slice(0, 160),
      time: formatNewsTime(n.create_time),
      sector: sectorOf(text),
      url: String(n.docurl || '')
    };
  }).filter(n => n.title);
}

function relatedNews(items, sectors) {
  return items.filter(n => sectors.includes(n.sector));
}

function createNewsLoader({win, doc, source = 'direct', timeout = 8000} = {}) {
  let items = [];
  let error = '';
  let loadedAt = '';
  let pending = false;

  function fromPayload(payload) {
    const list = parseNewsFeed(payload);
    if (!list.length) {
      error = '新闻解析失败';
      return false;
    }
    items = list;
    error = '';
    loadedAt = new Date().toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
    return true;
  }

  function load(cb) {
    if (pending) {
      if (cb) cb();
      return;
    }
    if (source === 'proxy') {
      pending = true;
      fetch('/api/news')
        .then(r => r.json())
        .then(json => {
          fromPayload(json);
          pending = false;
          if (cb) cb();
        })
        .catch(() => {
          error = '无法连接新闻源';
          pending = false;
          if (cb) cb();
        });
      return;
    }

    pending = true;
    const name = 'lcn' + Date.now();
    let settled = false;
    const settle = () => {
      if (settled) return;
      settled = true;
      pending = false;
      try { delete win[name]; } catch {}
      if (cb) cb();
    };
    win[name] = data => {
      try { fromPayload(data); } catch { error = '新闻解析失败'; }
      settle();
    };
    const s = doc.createElement('script');
    s.src = 'https://zhibo.sina.com.cn/api/zhibo/feed?page=1&page_size=30&zhibo_id=152&callback=' + name;
    s.async = true;
    s.onerror = () => { error = '无法连接新闻源（可能需要联网）'; settle(); };
    doc.head.appendChild(s);
    setTimeout(() => { if (!settled) { error = '新闻源响应超时'; settle(); } }, timeout);
  }

  return {
    load,
    snapshot: () => ({items, error, loadedAt, pending})
  };
}


/** 转转 MCP 返回值的解析与统计。纯函数，无网络，便于单测。 */

/** market_price 返回的是 key=value 文本 */
function parseMarketPriceText(text) {
  const out = {modelDesc: '', min: null, max: null, jumpUrl: ''};
  for (const line of String(text || '').split(/[\n\r]+/)) {
    const hit = /^([A-Za-z][\w]*)\s*=\s*(.*)$/.exec(line.trim());
    if (!hit) continue;
    const [_, key, value] = hit;
    if (key === 'modelDesc') out.modelDesc = value.trim();
    else if (key === 'dealMinPrice') out.min = toYuan(value);
    else if (key === 'dealMaxPrice') out.max = toYuan(value);
    else if (key === 'jumpUrl') out.jumpUrl = value.trim();
  }
  return out;
}

/** 价格可能是 "638" / "638.00" / "¥638"，统一成元；无法解析返回 null */
function toYuan(value) {
  const n = Number(String(value == null ? '' : value).replace(/[^\d.]/g, ''));
  return Number.isFinite(n) && n > 0 ? n : null;
}

/** search 返回的 items → 统一结构 */
function normalizeListings(items) {
  if (!Array.isArray(items)) return [];
  return items
    .map(it => {
      const price = toYuan(it && it.price);
      if (price === null) return null;
      return {
        id: String((it && it.infoId) || ''),
        title: String((it && it.title) || '').slice(0, 80),
        price,
        condition: String((it && it.chengSe) || ''),
        url: String((it && it.jumpUrl) || '')
      };
    })
    .filter(Boolean);
}

/** 分位数：把价格从小到大排队，看分布，避免极端值误导 */
function priceStats(prices) {
  const list = (prices || []).filter(n => Number.isFinite(n) && n > 0).sort((a, b) => a - b);
  if (!list.length) return {count: 0, min: null, p25: null, median: null, p75: null, max: null};
  const at = p => list[Math.min(list.length - 1, Math.max(0, Math.round((list.length - 1) * p)))];
  const mid = list.length % 2 === 1
    ? list[(list.length - 1) / 2]
    : Math.round((list[list.length / 2 - 1] + list[list.length / 2]) / 2);
  return {count: list.length, min: list[0], p25: at(0.25), median: mid, p75: at(0.75), max: list[list.length - 1]};
}

/** 汇总成前端要的行情快照 */
function buildSnapshot({keyword, marketText, items, source = 'zhuanzhuan', fetchedAt = Date.now()}) {
  const deal = parseMarketPriceText(marketText);
  const listings = normalizeListings(items);
  return {
    keyword,
    source,
    fetchedAt,
    deal,
    listings: {count: listings.length, stats: priceStats(listings.map(x => x.price)), sample: listings.slice(0, 5)}
  };
}



/** 优先用成交区间；没有时退回在售样本的 P25–P75，并标明来源 */
function refRange(snapshot) {
  const deal = (snapshot && snapshot.deal) || {};
  const stats = (snapshot && snapshot.listings && snapshot.listings.stats) || {};
  if (Number.isFinite(deal.min) && Number.isFinite(deal.max)) {
    return {min: deal.min, max: deal.max, source: 'deal'};
  }
  if (Number.isFinite(stats.p25) && Number.isFinite(stats.p75)) {
    return {min: stats.p25, max: stats.p75, source: 'listings'};
  }
  return {min: null, max: null, source: 'none'};
}

/** 校验模型输出：价格必须在成交区间内，否则修正并标注 */
function normalizeAdvice(payload, snapshot) {
  const deal = (snapshot && snapshot.deal) || {};
  const stats = (snapshot && snapshot.listings && snapshot.listings.stats) || {};
  const src = payload && typeof payload === 'object' ? payload : {};
  const price = src.suggestedPrice || {};
  let low = Number(price.low), high = Number(price.high);
  const risks = Array.isArray(src.risks) ? src.risks.map(String).slice(0, 4) : [];
  let fixed = false;

  if (!Number.isFinite(low) || !Number.isFinite(high)) {
    return {ok: false, reason: '模型没有给出有效的建议价', risks};
  }
  if (low > high) [low, high] = [high, low];

  const ref = refRange(snapshot);
  if (ref.source !== 'none') {
    const clampedLow = Math.max(ref.min, Math.min(ref.max, low));
    const clampedHigh = Math.max(ref.min, Math.min(ref.max, high));
    if (clampedLow !== low || clampedHigh !== high) {
      fixed = true;
      risks.push('建议价已按' + (ref.source === 'deal' ? '成交区间' : '样本参考区间') + ' ¥' + ref.min + '–' + ref.max + ' 修正');
      low = clampedLow;
      high = clampedHigh;
    }
  } else {
    risks.push('缺少行情区间，建议价仅供参考');
  }
  if ((stats.count || 0) < 5) risks.push('样本偏少（' + (stats.count || 0) + ' 件）');

  const timing = ['now', 'wait', 'hold'].includes(src.timing) ? src.timing : 'wait';
  return {
    ok: true,
    low: Math.round(low),
    high: Math.round(high),
    timing,
    reason: String(src.reason || '').slice(0, 120),
    risks: [...new Set(risks)].slice(0, 4),
    fixed
  };
}


/** 成色档位：把「同款在售中位」换算到该成色的合理价 */
const CONDITIONS = [
  {id: '99', label: '99新', factor: 1.05},
  {id: '95', label: '95新', factor: 1.00},
  {id: '90', label: '9成新', factor: 0.92},
  {id: '80', label: '8成新', factor: 0.85},
  {id: '70', label: '7成新', factor: 0.75}
];

function conditionFactor(id) {
  const hit = CONDITIONS.find(c => c.id === String(id));
  return hit ? hit.factor : 1;
}

function conditionLabel(id) {
  const hit = CONDITIONS.find(c => c.id === String(id));
  return hit ? hit.label : '95新';
}

/** 配件与保修加成，合计上限 6% */
function bonusFor(flags = {}) {
  let b = 0;
  if (flags.fullBox) b += 0.03;
  if (flags.warranty) b += 0.02;
  if (flags.invoice) b += 0.01;
  return Math.min(0.06, Math.round(b * 100) / 100);
}

/** 市场基准价：优先在售中位，其次成交中值 */
function marketBase(snapshot) {
  const st = (snapshot && snapshot.listings && snapshot.listings.stats) || {};
  const deal = (snapshot && snapshot.deal) || {};
  if (Number.isFinite(st.median)) return st.median;
  if (Number.isFinite(deal.min) && Number.isFinite(deal.max)) return Math.round((deal.min + deal.max) / 2);
  return null;
}

/** 砍价缓冲：样本多且集中→贴紧；样本少或分散→留空间 */
function bargainBuffer(snapshot) {
  const st = (snapshot && snapshot.listings && snapshot.listings.stats) || {};
  const count = st.count || 0;
  const spread = (Number.isFinite(st.p25) && Number.isFinite(st.p75) && st.p25 > 0)
    ? (st.p75 - st.p25) / st.p25
    : 1;
  if (count >= 20 && spread <= 0.35) return 0.05;
  if (count >= 8) return 0.08;
  return 0.10;
}

/**
 * 三档挂牌建议
 * opts: {condition, fullBox, warranty, invoice, recycle}
 */
function priceAdvice(snapshot, opts = {}) {
  const factor = conditionFactor(opts.condition || '95');
  const bonus = bonusFor(opts);
  const st = (snapshot && snapshot.listings && snapshot.listings.stats) || {};
  const deal = (snapshot && snapshot.deal) || {};
  const base = marketBase(snapshot);
  const notes = [];

  if (base == null) return {ok: false, reason: '没有可用的市场价', notes};

  const adj = (v) => Math.round(v * factor * (1 + bonus));
  const p25 = Number.isFinite(st.p25) ? st.p25 : base;
  const p75 = Number.isFinite(st.p75) ? st.p75 : base;
  let fast = adj(p25);
  let fair = adj(base);
  let patient = adj(p75);
  fast = Math.min(fast, fair);
  patient = Math.max(patient, fair);

  const floor = Number.isFinite(opts.recycle)
    ? opts.recycle
    : (Number.isFinite(deal.min) ? deal.min : null);

  if (floor != null && patient < floor) notes.push('市场价已低于回收价，直接回收更划算');
  if ((st.count || 0) < 5) notes.push('在售样本偏少，价格参考性一般');
  if (!Number.isFinite(st.median)) notes.push('缺少在售中位价，改用成交中值估算');
  if (bonus > 0) notes.push('已按配件/保修加成 ' + Math.round(bonus * 100) + '%');

  const buffer = bargainBuffer(snapshot);
  return {
    ok: true,
    base,
    factor,
    bonus,
    buffer,
    floor,
    p25,
    p75,
    tiers: {fast, fair, patient},
    listPrice: Math.round(fair * (1 + buffer)),
    notes
  };
}


/**
 * 持有成本：基于购入价与当前市场价
 * marketPrice 单位为元（与行情接口一致），asset.price 为分
 */
function holdingStats(asset, marketPriceYuan, at = today()) {
  if (!asset || !Number.isFinite(asset.price) || asset.price <= 0) return null;
  if (asset.status === '已售出' || asset.status === '已回收') return null;

  const days = Math.max(1, daysBetween(asset.date, at));
  const current = Number.isFinite(marketPriceYuan) && marketPriceYuan > 0
    ? Math.round(marketPriceYuan * 100)
    : null;

  const life = Math.max(1, Number(asset.life) || 3) * 365;
  const residual = Number(asset.residual) || 0;
  const perDayDep = (asset.price - residual) / life;

  if (current == null) {
    return {days, current: null, ratio: null, cost: null, daily: null, burn30: Math.round(perDayDep * 30)};
  }

  const cost = Math.max(0, asset.price - current);
  return {
    days,
    current,
    ratio: current / asset.price,
    cost,
    daily: cost / days,
    burn30: Math.round(perDayDep * 30)
  };
}

/** 允许出现在文案里的数字（元），用于事后校验，防止模型编价格 */

  const add = (v) => { if (Number.isFinite(v)) out.add(Math.round(v)); };
  const p = price || {};
  const t = p.tiers || {};
  add(t.fast); add(t.fair); add(t.patient); add(p.listPrice); add(p.floor); add(p.base); add(p.p25); add(p.p75);
  if (Number.isFinite(p.buffer)) add(p.buffer * 100);
  if (Number.isFinite(p.factor)) add(p.factor * 100);
  const h = hold || {};
  if (h.current != null) add(h.current / 100);
  if (h.daily != null) add(h.daily / 100);
  if (h.burn30 != null) add(h.burn30 / 100);
  if (h.ratio != null) add(h.ratio * 100);
  add(h.days);
  return [...out];
}

  ];
}

function numbersIn(text) {
  const out = [];
  const re = /(?:[¥￥]\s*)?(\d+(?:\.\d+)?)/g;
  let m;
  while ((m = re.exec(String(text || ''))) !== null) {
    const v = Number(m[1]);
    if (Number.isFinite(v)) out.push(v);
  }
  return out;
}

function normalizeListingPart(raw) {
  const src = raw && typeof raw === 'object' ? raw : {};
  const title = String(src.title || '').trim();
  const description = String(src.description || '').trim();
  const tags = Array.isArray(src.tags) ? src.tags.map((t) => String(t).trim()).filter(Boolean).slice(0, 5) : [];
  if (!title || !description) return null;
  return {title: title.slice(0, 30), description: description.slice(0, 200), tags};
}

/** 校验：文中出现的数字必须来自允许集合（±1 容差） */
function normalizeAdviceText(payload, allowed = []) {
  const src = payload && typeof payload === 'object' ? payload : {};
  const pricing = String(src.pricing || '').trim();
  const holding = String(src.holding || '').trim();
  const listing = normalizeListingPart(src.listing);
  if (!pricing && !holding && !listing) return {ok: false, reason: '模型没有给出解读'};

  const set = allowed.map(Number).filter(Number.isFinite);
  const stray = [];
  for (const text of [pricing, holding]) {
    for (const n of numbersIn(text)) {
      if (!set.some((a) => Math.abs(a - n) <= 1)) stray.push(n);
    }
  }

  const action = ['sell', 'wait', 'hold'].includes(src.action) ? src.action : 'wait';
  const risks = Array.isArray(src.risks) ? src.risks.map(String).slice(0, 2) : [];
  return {
    ok: true,
    pricing: pricing.slice(0, 80),
    holding: holding.slice(0, 80),
    listing,
    action,
    risks,
    unverified: [...new Set(stray)].slice(0, 3)
  };
}

function loadScript(doc, url, timeout = 8000) {
  return new Promise(resolve => {
    const s = doc.createElement('script');
    let settled = false;
    const done = ok => {
      if (settled) return;
      settled = true;
      resolve(ok);
    };
    s.src = url;
    s.async = true;
    s.onload = () => done(true);
    s.onerror = () => done(false);
    doc.head.appendChild(s);
    setTimeout(() => done(false), timeout);
  });
}

/**
 * 依次尝试多个 CDN；任一成功即初始化客户端。
 * 失败不抛异常——返回 {client: null, error}，调用方据此降级为纯本地模式。
 */
async function connectCloud({win, doc, config = CLOUD_CONFIG, urls = CLOUD_SDK_URLS} = {}) {
  try {
    if (!win.WorkBuddyCloud) {
      for (const url of urls) {
        await loadScript(doc, url);
        if (win.WorkBuddyCloud) break;
      }
    }
    if (!win.WorkBuddyCloud) return {client: null, error: '云服务 SDK 加载失败（网络无法访问 CDN）'};
    const client = win.WorkBuddyCloud.createWorkBuddyCloud(config);
    return {client, error: ''};
  } catch (e) {
    return {client: null, error: e && e.message ? e.message : '云服务初始化失败'};
  }
}

    return {ok: true, payload: {phone, verificationId: data.verificationId, isExistingUser: data.isExistingUser}};
  } catch (e) {
    return {ok: false, message: '网络错误，请重试'};
  }
}

/**
 * 当前为「整包快照」同步：一次上传/恢复整份 state。
 * 后续若改增量同步，只需替换本文件，页面无需改动。
 */
async function pushState(cloud, state) {
  if (!cloud) return {ok: false, message: '云服务未就绪'};
  try {
    const {error} = await cloud.database.from(CLOUD_TABLE).upsert({data: state}, {onConflict: 'owner_id'});
    return error ? {ok: false, message: error.message || '上传失败'} : {ok: true};
  } catch (e) {
    return {ok: false, message: (e && e.message) || '上传失败'};
  }
}

async function pullState(cloud) {
  if (!cloud) return {ok: false, message: '云服务未就绪'};
  try {
    const {data, error} = await cloud.database.from(CLOUD_TABLE).select('data').maybeSingle();
    if (error) return {ok: false, message: error.message || '读取失败'};
    if (!data || !data.data) return {ok: true, empty: true};
    return {ok: true, payload: data.data};
  } catch (e) {
    return {ok: false, message: (e && e.message) || '读取失败'};
  }
}

function categoryChart(rows){const list=summarize(rows),sum=list.reduce((s,x)=>s+x.amount,0);if(!sum)return `<div class="empty">${icon('leaf',30)}还没有支出，第一笔从今天开始。</div>`;let p=0;const gradient=list.map(c=>{const start=p;p+=c.amount/sum*100;return `${c.color} ${start}% ${p}%`;}).join(',');return `<div class="category-layout"><div class="donut" style="background:conic-gradient(${gradient})" role="img" aria-label="支出分类占比"><div class="donut-center"><small>总支出</small><strong>¥${money(sum,0)}</strong></div></div><div class="category-legend">${list.slice(0,5).map(c=>`<div class="legend-row"><i class="legend-dot" style="background:${c.color}"></i>${c.name}<strong>¥${money(c.amount,0)}</strong><small>${Math.round(c.amount/sum*100)}%</small></div>`).join('')}${list.length>5?`<small style="font-size:9px;color:#a0aa90">另有 ${list.length-5} 个分类，详见账本</small>`:''}</div></div>`;}
function renderReminders(limit=100){const rs=reminderItems().slice(0,limit);return rs.length?rs.map(r=>`<div class="reminder"><span class="reminder-icon">${icon('clock',21)}</span><div><strong>${esc(r.a.name)} · ${r.type}提醒</strong><p>${dateLabel(r.date)} ${r.type==='退货'?'前确认是否需要退货':'保修到期，请提前检查物品'}</p></div><span class="days">${r.days===0?'今天到期':`${r.days}天后`}</span></div>`).join(''):'<div class="empty">'+icon('check',24)+'近期没有到期事项，安心享受生活。</div>';}

function ensureMarketData(){
  const codes=markets.filter(m=>state.watchlist.includes(m.id)).map(m=>m.code);
  const key=codes.join(',');
  if(key===marketKey)return;
  marketKey=key;
  if(!quoteLoader)quoteLoader=createQuoteLoader({win:window,doc:document});
  if(!newsLoader)newsLoader=createNewsLoader({win:window,doc:document});
  if(codes.length)quoteLoader.load(codes,()=>{if(page==='market')renderMarketOnly();});
  if(!newsLoader.snapshot().items.length)newsLoader.load(()=>{if(page==='market')renderMarketOnly();});
}
function renderMarketOnly(){
  if(page!=='market')return;
  const el=$('#main');
  if(el)el.innerHTML=marketPage();

function prepareImageTiles(file,max=1800,maxTiles=3){
  return new Promise((resolve,reject)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
        const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
        const full=document.createElement('canvas');full.width=w;full.height=h;
        const fctx=full.getContext('2d');fctx.fillStyle='#fff';fctx.fillRect(0,0,w,h);fctx.drawImage(img,0,0,w,h);
        const ratio=h/w,tiles=ratio>3.2?Math.min(maxTiles,Math.max(2,Math.round(ratio/1.6))):1;
        const out=[];
        if(tiles===1)out.push(full.toDataURL('image/jpeg',0.82));
        else{
          const step=Math.floor(h/tiles),overlap=Math.round(step*0.06);
          for(let i=0;i<tiles;i++){
            const y=Math.max(0,i*step-(i?overlap:0));
            const bottom=i===tiles-1?h:Math.min(h,(i+1)*step+overlap);
            const ch=bottom-y;
            const c=document.createElement('canvas');c.width=w;c.height=ch;
            const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,ch);ctx.drawImage(full,0,y,w,ch,0,0,w,ch);
            out.push(c.toDataURL('image/jpeg',0.82));
          }
        }
        URL.revokeObjectURL(url);
        resolve(out);
      }catch{URL.revokeObjectURL(url);reject(Error('图片处理失败，请换一张 JPG 或 PNG'));}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('这张图片无法读取，请换一张 JPG 或 PNG'));};
    img.src=url;
  });
}
async function callChat(messages,tune){
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),90000);
  const request={model:visionCfg.model,messages,max_tokens:tune.maxTokens};
  if(tune.reasoningEffort)request.reasoning_effort=tune.reasoningEffort;
  if(tune.temperature!==null)request.temperature=tune.temperature;
  try{
    const res=await fetch(visionEndpoint(visionCfg),{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+visionCfg.key},body:JSON.stringify(request)});
    const text=await res.text();
    let body=null;try{body=JSON.parse(text);}catch{}
    if(!res.ok){const msg=body&&body.error&&body.error.message?body.error.message:(body&&body.message?body.message:text.slice(0,160));throw Error('接口返回 '+res.status+'：'+(msg||'请检查配置'));}
    if(!body)throw Error('接口返回的不是 JSON，请确认地址是 OpenAI 兼容的 /chat/completions');
    const choice=body.choices&&body.choices[0]?body.choices[0]:null,msg=choice&&choice.message?choice.message:null;
    const raw=msg?(Array.isArray(msg.content)?msg.content.map(x=>x.text||'').join(''):msg.content):'';
    try{return parseModelJson(raw);}
    catch(err){
      if(msg&&msg.reasoning_content){try{return parseModelJson(msg.reasoning_content);}catch{}}
      if(choice&&choice.finish_reason==='length')throw Error('模型的输出被截断了（思考占满了长度），请再试一次或换更小的截图');
      throw err;
    }
  }catch(err){
    if(err.name==='AbortError')throw Error('请求超时（90 秒），请检查网络后重试');
    if(err instanceof TypeError)throw Error('连不上接口：请检查接口地址与网络。用 file:// 打开时若被拦截，可改用本地服务器。');
    throw err;
  }finally{clearTimeout(timer);}
}

function commitDrafts(rows){
  const seen=new Set(state.transactions.map(t=>[t.title,t.amount,t.date,t.type].join('|')));
  const fresh=[];let skipped=0;
  for(const r of rows){
    const key=[r.title,r.amount,r.date,r.type].join('|');
    if(seen.has(key)){skipped++;continue;}
    seen.add(key);fresh.push(r);
  }
  if(fresh.length){state.transactions.unshift(...fresh);persist();}
  return {saved:fresh.length,skipped};
}

async function generateReport(){
  if(!marketState||!marketState.data)return;
  if(!visionReady(visionCfg)){marketState.reportLoading=false;marketState.report=null;renderMarketPanel();return;}
  const seq=(marketState.reportSeq||0)+1;
  marketState.reportSeq=seq;
  const asset=state.assets.find(x=>x.id===marketState.assetId)||{};
  const d=marketState.data,st=d.listings.stats||{},deal=d.deal||{};
  const adv=priceAdvice(d,{condition:marketState.condition,fullBox:marketState.fullBox,warranty:marketState.warranty,invoice:marketState.invoice});
  const midYuan=st.median!=null?st.median:((deal.min!=null&&deal.max!=null)?Math.round((deal.min+deal.max)/2):null);
  const hold=holdingStats(asset,midYuan);
  marketState.reportLoading=true;marketState.reportError='';
  renderMarketPanel();
  try{
    const payload=await callChat(buildAdviceMessages(asset,{condition:marketState.condition,fullBox:marketState.fullBox,warranty:marketState.warranty,invoice:marketState.invoice,price:adv,hold,snapshot:d}),visionTuning(visionCfg));
    if(seq!==marketState.reportSeq)return;
    const res=normalizeAdviceText(payload,allowedNumbers(adv,hold));
    if(!res.ok)throw Error(res.reason||'解读失败');
    marketState.report=res;
  }catch(err){
    if(seq!==marketState.reportSeq)return;
    marketState.reportError=err&&err.message?err.message:'解读失败';
  }finally{
    if(seq===marketState.reportSeq){marketState.reportLoading=false;renderMarketPanel();}
  }
}

async function askResaleAdvice(){

document.addEventListener('submit',e=>{const form=e.target;if(!['tx-form','asset-form','budget-form','parsed-form','watchlist-form','vision-form','login-form'].includes(form.id))return;e.preventDefault();try{if(form.id==='tx-form'){const data=readTx(form),existing=state.transactions.find(t=>t.id===editTxId);
if(!existing&&state.transactions.some(t=>t.title===data.title&&t.amount===data.amount&&t.date===data.date&&t.type===data.type))throw Error('存在同名、同金额、同日期的记录，请先检查账本，避免重复记账。');const tx={...data,id:existing?.id||createId()};const link=new FormData(form).has('asset');if(link&&data.type!=='expense')throw Error('只能将支出关联为购入物品');if(existing)state.transactions=state.transactions.map(t=>t.id===existing.id?tx:t);else state.transactions.unshift(tx);persist();closeModal();render();toast('记录已保存到此浏览器');if(link)assetModal('',tx);}else if(form.id==='asset-form'){const f=new FormData(form),price=toCents(f.get('price')),residual=Number(f.get('residual'))===0?0:toCents(f.get('residual')),life=Number(f.get('life')),date=String(f.get('date'));if(residual>price)throw Error('预计残值不能高于购买价格');if(life<.5||life>100)throw Error('使用年限需在0.5至100年之间');if(date>today())throw Error('购买日期不能晚于今天');for(const k of ['returnDate','warrantyDate'])if(f.get(k)&&f.get(k)<date)throw Error('退货或保修截止日不能早于购买日期');const a={id:form.dataset.id||createId(),txId:form.dataset.tx||'',name:String(f.get('name')).trim(),category:String(f.get('category')),emoji:String(f.get('emoji')),price,residual,life,date,returnDate:String(f.get('returnDate')),warrantyDate:String(f.get('warrantyDate')),status:String(f.get('status')),note:String(f.get('note')).trim(),resale:f.get('resale')===''?null:Number(f.get('resale'))===0?0:toCents(f.get('resale'))};if(!a.name)throw Error('请填写物品名称');if(state.assets.some(x=>x.id===a.id))state.assets=state.assets.map(x=>x.id===a.id?a:x);else state.assets.push(a);persist();closeModal();render();toast('物品已保存，提醒已同步更新');}else if(form.id==='budget-form'){state.budget=toCents(new FormData(form).get('budget'));persist();closeModal();render();toast('月度预算已更新');}else if(form.id==='parsed-form'){const f=new FormData(form);const rows=parsed.map((t,i)=>{const title=String(f.get(`title-${i}`)).trim();if(!title)throw Error('请填写每一笔的交易名称');const category=String(f.get(`category-${i}`)||'');return {...t,title,amount:toCents(f.get(`amount-${i}`)),date:String(f.get(`date-${i}`)),type:String(f.get(`type-${i}`)),category,note:String(f.get(`note-${i}`)||t.note||'').trim().slice(0,160)};});const seen=new Set(state.transactions.map(t=>[t.title,t.amount,t.date,t.type].join('|')));for(const t of rows){const key=[t.title,t.amount,t.date,t.type].join('|');if(seen.has(key))throw Error('发现重复记录，请检查账本或修改草稿，避免重复入账。');seen.add(key);}state.transactions.unshift(...rows);persist();closeModal();render();toast(`已保存 ${rows.length} 笔记录`);}else if(form.id==='watchlist-form'){state.watchlist=new FormData(form).getAll('watch');persist();closeModal();marketKey='';render();toast('自选已更新');}else if(form.id==='login-form'){doVerify();}else if(form.id==='vision-form'){const cfg=collectVisionCfg();if(!(cfg.baseUrl.startsWith('http://')||cfg.baseUrl.startsWith('https://')))throw Error('接口地址需以 http:// 或 https:// 开头');if(!cfg.model)throw Error('请填写模型名称');if(!cfg.key)throw Error('请填写 API Key');visionCfg=cfg;saveVisionCfg();render();toast('识图配置已保存，可以去“记一笔”里上传图片了');}}catch(err){if($('#form-error'))$('#form-error').textContent=err.message;else toast(err.message);}});
document.addEventListener('input',e=>{if(e.target.id==='tx-search'){txSearch=e.target.value;$('#ledger-body').innerHTML=transactionTable(filteredTx());$('#tx-count').textContent=filteredTx().length+' 笔';}if(e.target.id==='asset-search'){assetSearch=e.target.value;$('#asset-grid').innerHTML=assetCards();}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='import-file'){importBackupFile(e.target.files[0]);e.target.value='';}if(id==='month-filter'&&e.target.value){month=e.target.value;render();}if(id==='type-filter'){txType=e.target.value;render();}if(id==='category-filter'){txCategory=e.target.value;render();}if(id==='asset-status'){assetStatus=e.target.value;render();}if(id==='receipt-input'){handleReceipt(e.target.files);e.target.value='';}if(id==='vision-provider'){const p=presetFor(e.target.value),base=$('#vision-base'),model=$('#vision-model');if(base&&p.baseUrl)base.value=p.baseUrl;if(model)model.value=p.models[0]||'';}});
document.addEventListener('dragover',e=>{const z=e.target&&e.target.closest?e.target.closest('#upload-zone'):null;if(z){e.preventDefault();z.classList.add('dragover');}});
document.addEventListener('dragleave',e=>{const z=e.target&&e.target.closest?e.target.closest('#upload-zone'):null;if(z)z.classList.remove('dragover');});
document.addEventListener('drop',e=>{const z=e.target&&e.target.closest?e.target.closest('#upload-zone'):null;if(!z)return;e.preventDefault();z.classList.remove('dragover');const fs=e.dataTransfer&&e.dataTransfer.files?e.dataTransfer.files:null;if(fs&&fs.length)handleReceipt(fs);});
document.addEventListener('paste',e=>{if(!$('#upload-zone'))return;const items=e.clipboardData&&e.clipboardData.items?e.clipboardData.items:[];for(const it of items){if(it.kind==='file'&&it.type.startsWith('image/')){const f=it.getAsFile();if(f){e.preventDefault();handleReceipt(f);return;}}}});
document.addEventListener('keydown',e=>{if(!$('#modal-root').innerHTML)return;if(e.key==='Escape'){e.preventDefault();closeModal();}if(e.key==='Tab'){const items=[...document.querySelectorAll('.modal button:not(:disabled),.modal input:not(:disabled),.modal select:not(:disabled),.modal textarea:not(:disabled)')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
window.addEventListener('hashchange',()=>{closeModal();render();window.scrollTo({top:0,behavior:'instant'});});
persist();render();

})();
</script>
